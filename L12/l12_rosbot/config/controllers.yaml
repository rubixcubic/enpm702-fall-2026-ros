# Parameters of the two controllers of l12_rosbot.
# The /** key matches every node: both controllers use Gazebo's clock.
/**:
  ros__parameters:
    use_sim_time: true

heading_controller_node:
  ros__parameters:
    target_headings_deg: [90.0, 180.0, -90.0, 0.0]
    kp_angular: 1.5
    max_angular_rps: 1.0
    yaw_tolerance_rad: 0.02

distance_controller_node:
  ros__parameters:
    target_distance_m: 1.0
    kp_linear: 0.8
    max_linear_mps: 0.5
    distance_tolerance_m: 0.02
